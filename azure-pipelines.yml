trigger: none 
pool: Default

stages:
  - stage: SoftwareAnalysis
    displayName: Software Component Analysis
    jobs:
      - job: DependencyVulnerabilityScan
        displayName: Dependency Vulnerability Scan(Retire.js)
        steps:
        - task: NodeTool@0
          inputs:
            versionSource: 'spec'
            versionSpec: '18.x'
        - task: PowerShell@2
          displayName: Run Dependency Security Scan
          inputs:
            targetType: 'inline'
            script: |
              npm install -g retire
              retire --outputformat cyclonedx
  - stage: StaticCodeAnalysis
    displayName: Static Code Analysis
    jobs:
      - job: SonarQubeAnalysis
        displayName: Static Code Analysis(SonarQube)
        steps:
        - task: SonarQubeAnalyze@8
          inputs:
            jdkversion: 'JAVA_HOME_17_X64'
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              sonar-scanner \
                -Dsonar.projectKey=todoproject \
                -Dsonar.sources=. \
                -Dsonar.host.url=http://localhost:9000 \
                -Dsonar.token=sqp_ceeb24ab07a27fa2099c1d6150aaaad904a75008
          
