trigger: none 
pool: Default

stages:
  - stage: SoftwareAnalysis
    displayName: Software Component Analysis
    jobs:
      - job: DependencyVulnerabilityScan
        displayName: Dependency Vulnerability Scan(Retire.js)
        steps:
        - task: NodeTool@0
          inputs:
            versionSource: 'spec'
            versionSpec: '18.x'
        - task: PowerShell@2
          displayName: Run Dependency Security Scan
          inputs:
            targetType: 'inline'
            script: |
              npm install -g retire
              retire --outputformat cyclonedx
  - stage: StaticCodeAnalysis
    displayName: Static Code Analysis
    jobs:
      - job: SonarQubeAnalysis
        displayName: Static Code Analysis(SonarQube)
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'sonar-scanner.bat -D"sonar.projectKey=todoproject" -D"sonar.sources=." -D"sonar.host.url=http://localhost:9000" -D"sonar.token=$(token)"'
  - stage: CodeQualityChecks
    displayName: Code Quality & Linting
    jobs:
      - job: Lintingcheck
        displayName: Multi-Language Linting Checks
        steps:
        - task: PowerShell@2
          continueOnError: yes
          inputs:
            targetType: 'inline'
            script: 'biome.exe lint $(System.DefaultWorkingDirectory)'
        - task: PowerShell@2
          continueOnError: yes
          inputs:
            targetType: 'inline'
            script: |
              pip install --user yamllint 
              yamllint $(System.DefaultWorkingDirectory)
  - stage : BuildAndPackage
    displayName: Build & Artifact Packaging
    jobs:
      - job: ApplicationBuild
        displayName: Application Build
        steps:
        - task: NodeTool@0
          displayName: Install Node.Js
          inputs:
            versionSource: 'spec'
            versionSpec: '16.x'
        - task: PowerShell@2
          displayName: Install Dependencies
          inputs:
            targetType: 'inline'
            script: 'npm install'
        - task: PowerShell@2
          displayName: Build the Project
          inputs:
            targetType: 'inline'
            script: 'npm run build'
        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(Pipeline.Workspace)/build'
            artifact: 'todofrontend app'
            publishLocation: 'pipeline'

        # - task: DownloadPipelineArtifact@2
        #   inputs:
        #     buildType: 'current'
        #     artifactName: 'todofrontend app'
        #     targetPath: '$(Pipeline.Workspace)/build_artifacts'
    
  - stage : AppDeployment
    displayName: Deploy to VM(Enviroments)
    jobs:
      - deployment: deploytovm
        displayName: Deploye to VM
        environment:
         name: frontend-deploy
         resourceType: virtualMachine
        strategy:
          runOnce:
            deploy:
              steps:
              - task: DownloadPipelineArtifact@2
                inputs:
                  buildType: 'current'
                  artifactName: 'todofrontend app'
                  targetPath: '$(Pipeline.Workspace)build_artifacts'
                  
              